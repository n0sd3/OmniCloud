services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # encryptionKey deriva de os.hostname() (backend/src/config/env.js);
    # sem hostname fixo, recriar o container invalida os tokens salvos no volume.
    hostname: omnicloud-api
    env_file:
      - path: backend/.env
        required: false
    environment:
      # CORS_ORIGIN, FRONTEND_URL e os *_REDIRECT_URI vêm do backend/.env —
      # fixá-los aqui sobrescreveria a URL pública e quebraria o retorno do OAuth.
      PORT: 8787
      DATABASE_PATH: /app/data/omnicloud.db
      FILE_CACHE_PATH: /app/cache/files
      SMB_PROVISION_SECRET: ${SMB_PROVISION_SECRET:?defina SMB_PROVISION_SECRET no .env}
      SMB_HOST: ${SMB_HOST:-omnicloud}
    volumes:
      - omnicloud_api_data:/app/data
      - omnicloud_file_cache:/app/cache/files
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_BASE_URL: /ws/uploads
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  smb:
    build:
      context: .
      dockerfile: smb/Dockerfile
    # FUSE precisa destas três permissões; é uma elevação real em relação aos
    # outros containers da stack.
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    environment:
      OMNICLOUD_API_URL: http://api:8787
      SMB_PROVISION_SECRET: ${SMB_PROVISION_SECRET:?defina SMB_PROVISION_SECRET no .env}
      RCLONE_VFS_CACHE_MAX_SIZE: ${RCLONE_VFS_CACHE_MAX_SIZE:-20G}
    volumes:
      - omnicloud_rclone_cache:/var/cache/rclone
    ports:
      - "445:445"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  omnicloud_api_data:
  omnicloud_file_cache:
  omnicloud_rclone_cache:
